<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css">
    <title>Google-Clone</title>
</head>

    <body>
        <!---CABEÇALHO DO GOOGLE---->
        <header class="header-topo">
            <div class="links-da-direita">
                <a href="#">Gmail</a>
                <a href="#">Images</a>
            </div>
            <!-- Ícone de menu de pontinhos -->
                <button class="botao-icone" title="Aplicativos do Google">
                    <span class="material-symbols-outlined">apps</span>
                </button>
                <!-- O avatar da inicial -->
                <div class="avatar"></div>


        </header>



    <div class="container-principal">
        <!----LOGO DO GOOGLE---->
        <h1>
    <span class="g-azul">G</span><span class="o-vermelho">o</span><span class="o-amarelo">o</span><span class="g2-azul">g</span><span class="l-verde">l</span><span class="e-vermelho">e</span>
</h1>

        <!----CAIXA DE PESQUISA---->
        <div class="caixa-pesquisa">
            <span class="material-symbols-outlined icone-lupa">search</span>
            <input type="text" placeholder="Pesquise no Google ou digite uma URL...">
            <!-- Ícones da direita (microfone e câmera, por exemplo) -->
            <div class="icones-direita">
                <span class="material-symbols-outlined" title="Pesquisa por voz">mic</span>
                <span class="material-symbols-outlined" title="Pesquisa por imagem">photo_camera</span>
            </div>
        </div>
    </div>

    <div class="area-de-botoes">
        <button class="botao-pesquisar">Pesquisa Google</button>
        <button class="botao-buscar">Estou com Sorte</button>
    </div>

    </div>

    <footer class="footer">

        <!-- Caixa 1: Linha de cima (Localização/País) -->
        <div class="footer-superior">
            Brasil
        </div>

        <!-- Caixa 2: Linha de baixo (Links) -->
         <div class="footer-inferior">
                <div class="links-da-esquerda">
            <a href="#">Sobre</a>
            <a href="#">Publicidade</a>
            <a href="#">Negócios</a>
            <a href="#">Como funciona a Pesquisa</a>
            </div>

            <div class="links-da-direita">
                <a href="#">Privacidade</a>
                <a href="#">Termos</a>
                <a href="#">Configurações</a>
                
            </div>
         </div>

    </footer>

</body>

</html>
